{% extends 'base.html' %} 

{% block title %}Eliminar Producto - Soluciones Apache{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 rounded-4 text-center">
            <div class="card-body p-5">
                <div class="mb-4">
                    <i class="fa-solid fa-triangle-exclamation text-danger" style="font-size: 3.5rem;"></i>
                </div>
                <h3 class="fw-bold text-dark mb-3">Eliminar Producto</h3>
                <p class="text-muted mb-4" style="font-size: 1.1rem;">
                    Estás a punto de eliminar el producto <br>
                    <strong class="text-dark">"{{ producto.nombre }}"</strong>.<br>
                    Esta acción no se puede deshacer.
                </p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'inventario:lista_productos' %}" class="btn fw-bold px-4" style="background-color: #f1f5f9; color: #475569; border-radius: 8px;">Cancelar</a>
                        <button type="submit" class="btn btn-danger fw-bold px-4" style="background-color: #dc2626; border: none; border-radius: 8px;">Sí, eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
