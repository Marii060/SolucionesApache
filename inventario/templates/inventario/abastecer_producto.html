{% extends 'base.html' %} 

{% block title %}Agregar Stock - Soluciones Apache{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 text-center">
                <h5 class="fw-bold mb-4">Agregar Stock</h5>
                <p class="text-muted mb-4">Producto: <strong class="text-dark">{{ producto.nombre }}</strong></p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">CANTIDAD A AGREGAR</label>
                        <input type="number" name="cantidad" min="1" class="form-control text-center fs-3" required autofocus>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{% url 'inventario:lista_productos' %}" class="btn w-100 bg-light">Cancelar</a>
                        <button type="submit" class="btn w-100 text-white" style="background-color: #16a34a;">Confirmar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
