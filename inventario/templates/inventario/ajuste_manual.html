{% extends 'base.html' %} 

{% block title %}Ajuste Manual - Soluciones Apache{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 px-md-4">
    <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0" style="color: #0f172a; font-size: 1.8rem;">Ajuste Manual de Inventario</h2>
                <p class="text-muted m-0 mt-1" style="font-size: 0.9rem;">
                    <span class="text-primary">Inventario &rsaquo;</span> Registrar ajuste
                </p>
            </div>
        </div>

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <h6 class="fw-bold text-uppercase text-muted mb-4"><i class="fa-solid fa-box text-warning me-2"></i> PRODUCTO A AJUSTAR</h6>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="row mb-4">
                        <div class="col-12">
                            <label class="form-label fw-bold small text-muted">Producto *</label>
                            <!-- Script integrado para actualizar el stock dinámicamente -->
                            <select name="producto_id" id="prodSelect" class="form-select border-1" required onchange="actualizarStock()">
                                <option value="">Buscar y seleccionar producto...</option>
                                {% for prod in productos %}
                                    <option value="{{ prod.id_producto }}" data-stock="{{ prod.cantidad }}">
                                        {{ prod.codigo_interno }} - {{ prod.nombre }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label fw-bold small text-muted">Stock Actual</label>
                            <input type="text" id="stockActual" class="form-control bg-light text-muted" value="-" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Tipo de Ajuste *</label>
                            <select name="tipo_ajuste" id="tipoAjuste" class="form-select" required onchange="calcularResultante()">
                                <option value="">Seleccionar tipo...</option>
                                <option value="Entrada">Entrada (Sumar)</option>
                                <option value="Salida">Salida (Restar)</option>
                                <option value="Ajuste">Ajuste (Corrección)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label fw-bold small text-muted">Cantidad *</label>
                            <input type="number" name="cantidad" id="cantAjuste" class="form-control" min="1" value="0" required onkeyup="calcularResultante()" onchange="calcularResultante()">
                            <div class="form-text">Unidades a agregar o retirar.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Stock Resultante</label>
                            <input type="text" id="stockResultante" class="form-control bg-light fw-bold" value="-" readonly>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-12">
                            <label class="form-label fw-bold small text-muted">Motivo del Ajuste *</label>
                            <select name="motivo" class="form-select mb-3" required>
                                <option value="">Seleccionar motivo...</option>
                                <option value="Inventario Físico">Conteo de Inventario Físico</option>
                                <option value="Mercancía Dañada">Mercancía Dañada/Defectuosa</option>
                                <option value="Pérdida/Robo">Pérdida o Robo</option>
                                <option value="Regalía/Donación">Regalía o Uso Interno</option>
                                <option value="Corrección de Error">Corrección de Error de Sistema</option>
                            </select>

                            <label class="form-label fw-bold small text-muted">Observaciones adicionales</label>
                            <textarea name="observaciones" class="form-control" rows="3" placeholder="Descripción detallada del motivo..."></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-3 justify-content-end border-top pt-4">
                        <a href="{% url 'inventario:control_inventario' %}" class="btn fw-bold px-4 bg-white border" style="color: #475569; border-radius: 8px;">&larr; Cancelar</a>
                        <button type="submit" class="btn fw-bold px-5 text-white" style="background-color: #2563eb; border-radius: 8px;">
                            <i class="fa-solid fa-save me-2"></i> Registrar Ajuste
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Pequeño Script para hacer la calculadora en vivo -->
<script>
    function actualizarStock() {
        let select = document.getElementById("prodSelect");
        let stock = select.options[select.selectedIndex].getAttribute("data-stock");
        document.getElementById("stockActual").value = stock ? stock : "-";
        calcularResultante();
    }

    function calcularResultante() {
        let stockAct = parseInt(document.getElementById("stockActual").value) || 0;
        let cant = parseInt(document.getElementById("cantAjuste").value) || 0;
        let tipo = document.getElementById("tipoAjuste").value;
        let inputRes = document.getElementById("stockResultante");

        if (document.getElementById("stockActual").value === "-") {
            inputRes.value = "-";
            return;
        }

        if (tipo === "Salida") {
            inputRes.value = stockAct - cant;
        } else if (tipo === "Entrada" || tipo === "Ajuste") {
            inputRes.value = stockAct + cant;
        } else {
            inputRes.value = stockAct;
        }
    }
</script>
{% endblock %}
