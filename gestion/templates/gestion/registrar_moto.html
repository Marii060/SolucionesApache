{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 700px;">
    <!-- Encabezado -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-dark">{% if moto %}Editar Moto{% else %}Registrar Moto{% endif %}</h2>
        <a href="{% url 'gestion:lista_motos' %}" 
   class="btn fw-bold px-4 shadow-sm" 
   style="background-color: #3b71ca; color: white; border-radius: 8px; border: none;">
   Volver
</a>
    </div>

    <!-- Formulario estructurado -->
    <div class="card shadow-sm border-0 rounded-4 p-4">
        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <!-- Cliente -->
                <div class="col-12 mb-3">
                    <label class="form-label fw-bold text-muted">Cliente</label>
                    {{ form.id_cliente }}
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-muted">Placa</label>
                    {{ form.placa }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-muted">Marca</label>
                    {{ form.marca }}
                </div>
                
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-muted">Modelo</label>
                    {{ form.modelo }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold text-muted">Cilindraje</label>
                    {{ form.cilindraje }}
                </div>
                
                <div class="col-12 mb-3">
                    <label class="form-label fw-bold text-muted">Kilometraje</label>
                    {{ form.kilometraje }}
                </div>
                
                <div class="col-12 mb-3">
                    <label class="form-label fw-bold text-muted">Observaciones</label>
                    {{ form.observaciones }}
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold mt-3 py-2">
                {% if moto %}Guardar Cambios{% else %}Registrar Moto{% endif %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
