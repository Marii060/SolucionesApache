{% extends 'base.html' %}

{% block title %}Eliminar Cliente - Soluciones Apache{% endblock %}

{% block content %}
<style>
    .card-custom { 
        border-radius: 16px; 
        border: 1px solid #f0f2f5; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
        max-width: 450px; 
        margin: 50px auto; 
        padding: 30px;
    }
    .icon-box {
        width: 60px;
        height: 60px;
        background-color: #fee2e2;
        color: #ef4444;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin: 0 auto 20px;
    }
</style>

<div class="card card-custom bg-white text-center">
    <div class="icon-box">
        <i class="fa-solid fa-trash-can fa-lg"></i>
    </div>
    
    <h4 class="fw-bold text-dark mb-3">¿Eliminar Registro?</h4>
    <p class="text-muted mb-4">
        ¿Estás seguro de que deseas eliminar a <strong>{{ cliente.nombre }}</strong>? 
        Esta acción es permanente y no se podrá deshacer.
    </p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-danger fw-bold py-2" style="border-radius: 8px;">
                Sí, eliminar definitivamente
            </button>
            <a href="{% url 'gestion:lista_cliente' %}" class="btn btn-outline-secondary fw-bold py-2" style="border-radius: 8px; border: none;">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
