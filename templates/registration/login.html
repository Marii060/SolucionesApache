<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Soluciones Apache</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* CSS para recrear tu Mockup */
        body {
            background-color: #d1d5db; /* Fondo gris claro parecido a la imagen */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: white;
        }
        .text-title {
            color: #4f46e5;
            font-weight: bold;
        }
        .btn-login {
            background-color: #4f46e5;
            color: white;
            font-weight: 500;
            border-radius: 8px;
        }
        .btn-login:hover {
            background-color: #4338ca;
            color: white;
        }
        .input-group-text {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <h2 class="text-title mb-1">Bienvenidos a<br>Soluciones Apache</h2>
        <p class="text-muted mb-4 mt-2">Inicia sesión para continuar</p>

        {% if form.errors %}
            <div class="alert alert-danger small py-2" role="alert">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="input-group mb-3">
                <span class="input-group-text">👤</span>
                <input type="text" name="username" class="form-control bg-light" placeholder="Usuario" required autofocus>
            </div>
            
            <div class="input-group mb-3">
                <span class="input-group-text">🔒</span>
                <input type="password" name="password" class="form-control bg-light" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="btn btn-login w-100 py-2 mb-3 mt-2">Iniciar Sesión</button>
            
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div class="form-check text-start">
                    <input type="checkbox" class="form-check-input" id="recordarme">
                    <label class="form-check-label small text-muted text-danger" for="recordarme">
                        <span class="text-danger">✔</span> Recordarme
                    </label>
                </div>
            </div>
        </form>
    </div>

</body>
</html>
