{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Soluciones Apache</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            background-image: url("{% static 'img/fondo.png' %}");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center; 
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }


        .login-card {
            background-color: rgba(153, 148, 148, 0.95);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
        }

        .text-title {
            font-weight: 800;
            font-size: 1.6rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .text-subtitle {
            color: #363535;
            margin-bottom: 30px;
        }

        .input-group { margin-bottom: 20px; }
        .input-group-text {
            background-color: #eee;
            border: none;
            border-radius: 30px 0 0 30px;
        }
        .form-control {
            background-color: #eee;
            border: none;
            border-radius: 0 30px 30px 0;
            padding: 12px;
        }
        
        .btn-login {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            border-radius: 30px;
            padding: 12px;
            width: 100%;
            border: none;
            transition: 0.3s;
        }
        .btn-login:hover { background-color: #0b5ed7; }
        
        .forgot-link {
            display: block;
            margin-top: 15px;
            color: #0d6efd;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="text-title">BIENVENIDOS SOLUCIONES APACHE</h2>
        <p class="text-subtitle">Inicia sesión para continuar</p>

        {% for message in messages %}
        <div class="alert alert-danger small">{{ message }}</div>
        {% endfor %}

        <form method="post" action="{% url 'gestion:login' %}">
            {% csrf_token %}
            
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required autofocus>
            </div>
            
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
            </div>

            <button type="submit" class="btn btn-login shadow">Iniciar sesión</button>
        </form>
    </div>

</body>
</html>
