<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Soluciones Apache{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
    $(document).ready(function() {
        $('select[name="id_cliente"]').select2({
            placeholder: "Buscar cliente...",
            width: '100%'
        });
    });
</script>
    <style>
        body {
            background-color: #dbdee0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /*ESTILOS DE LA BARRA LATERAL*/
        .sidebar {
            height: 100vh;
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #4b5f83;
            color: white;
            display: flex; /* Nuevo: para organizar elementos en columna */
            flex-direction: column; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .sidebar-brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #3d4f70;
            margin-bottom: 10px;
        }

        /* Contenedor que permite scroll en el menú */
        .sidebar-menu {
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-heading {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #8c9bb3;
            padding: 15px 25px 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .sidebar a {
            padding: 12px 25px;
            text-decoration: none;
            color: #b0c0d8;
            display: block;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .sidebar a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .sidebar a:hover, .sidebar a.active {
            color: white;
            background-color: #1e2a40;
            border-left: 4px solid #4f46e5;
        }

        /*ESTILOS DEL CONTENIDO PRINCIPAL*/
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }

        /* Botón de cerrar sesión corregido */
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid #3d4f70;
        }
        .logout-btn {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            Soluciones Apache
        </div>

        <div class="sidebar-menu">
            <a href="{% url 'gestion:dashboard' %}"><i class="fa-solid fa-house"></i> Dashboard</a>

            <div class="sidebar-heading">Clientes</div>
            <a href="{% url 'gestion:lista_cliente' %}"><i class="fa-solid fa-users"></i> Clientes</a>
            
            <a href="{% url 'gestion:lista_motos' %}" class="{% if request.resolver_match.url_name == 'lista_motos' %}active{% endif %}">
                <i class="fa-solid fa-motorcycle"></i> Motos
            </a>
            
            <div class="sidebar-heading">Taller</div>
            <a href="{% url 'operaciones:crear_servicio' %}" class="{% if request.resolver_match.url_name == 'crear_servicio' %}active{% endif %}">
                <i class="fa-solid fa-wrench"></i> Nueva Orden 
            </a>
            <a href="#">
                <i class="fa-solid fa-list"></i> Catálogo de Servicios
            </a>

            <div class="sidebar-heading">Comercial</div>
            <a href="#"><i class="fa-solid fa-cart-shopping"></i> Ventas</a>
            <a href="#"><i class="fa-solid fa-plus"></i> Nueva Venta</a>
            <a href="#"><i class="fa-solid fa-credit-card"></i> Créditos</a> 
            <a href="#"><i class="fa-solid fa-box"></i> Productos</a>
            <a href="#"><i class="fa-solid fa-clipboard"></i> Inventario</a>
            <a href="#"><i class="fa-solid fa-industry"></i> Compras</a>
            <a href="#"><i class="fa-solid fa-building"></i> Proveedores</a>

            <div class="sidebar-heading">Administración</div>
            <a href="#"><i class="fa-solid fa-chart-line"></i> Reportes</a>
            <a href="#"><i class="fa-solid fa-clipboard-check"></i> Auditoría</a>
            <a href="#"><i class="fa-solid fa-gear"></i> Configuración</a>
        </div>

        <!-- Botón de Cerrar Sesión corregido -->
        <div class="sidebar-footer">
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger logout-btn text-white fw-bold">
                    <i class="fa-solid fa-power-off"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
