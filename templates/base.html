<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Soluciones Apache{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #f4f7fa; /* Fondo gris claro de la imagen */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* === ESTILOS DE LA BARRA LATERAL === */
        .sidebar {
            height: 100vh;
            width: 260px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #2b3a55; /* Azul oscuro elegante */
            color: white;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .sidebar-brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #3d4f70;
            margin-bottom: 10px;
        }

        .sidebar-heading {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #8c9bb3;
            padding: 15px 25px 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .sidebar a {
            padding: 12px 25px;
            text-decoration: none;
            color: #b0c0d8;
            display: block;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .sidebar a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .sidebar a:hover, .sidebar a.active {
            color: white;
            background-color: #1e2a40;
            border-left: 4px solid #4f46e5;
        }

        /* === ESTILOS DEL CONTENIDO PRINCIPAL === */
        .main-content {
            margin-left: 260px; /* Empuja el contenido para dejar espacio a la barra */
            padding: 30px;
        }

        /* Botón de cerrar sesión al final */
        .logout-btn {
            position: absolute;
            bottom: 20px;
            width: 90%;
            margin: 0 5%;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
            🏍️ Soluciones Apache
        </div>

        <a href="{% url 'gestion:dashboard' %}" class="active"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="{% url 'gestion:lista_clientes' %}"><i class="fa-solid fa-users"></i> Clientes</a>
        <a href="#"><i class="fa-solid fa-motorcycle"></i> Motos</a>

        <div class="sidebar-heading">Taller</div>
        <a href="#"><i class="fa-solid fa-wrench"></i> Órdenes</a>
        <a href="#"><i class="fa-solid fa-clipboard-list"></i> Servicios</a>

        <div class="sidebar-heading">Comercial</div>
        <a href="#"><i class="fa-solid fa-cart-shopping"></i> Ventas</a>
        <a href="#"><i class="fa-solid fa-plus"></i> Nueva Venta</a>
        <a href="#"><i class="fa-solid fa-credit-card"></i> Créditos</a> 
        <a href="#"><i class="fa-solid fa-box"></i> Productos</a>

        <a href="#" class="btn btn-danger logout-btn text-white" style="border-left: none;"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</a>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
